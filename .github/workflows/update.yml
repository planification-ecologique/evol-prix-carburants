name: Mise à jour des données et publication

on:
  schedule:
    - cron: "7 * * * *" # toutes les heures
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3
      # Les archives annuelles ne changent plus : on les garde en cache entre deux exécutions
      - uses: actions/cache@v4
        with:
          path: .cache
          key: archives-v1-${{ github.run_id }}
          restore-keys: archives-v1-
      - name: Calcul des données
        run: python pipeline/build.py --out _site/data --cache .cache
      - name: Assemblage du site
        run: |
          cp site/* _site/
          du -sh _site/data/*
          du -sh _site/data/stations/* | sort -h | tail -3
      - name: Vérification du fond de carte IGN (informative)
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "Plan IGN : HTTP %{http_code}, %{content_type}\n" \
            "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX=6&TILEROW=22&TILECOL=32"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
