name: Mise à jour des données et publication

on:
  schedule:
    # GitHub ne garantit pas les déclenchements planifiés (en pratique 3 à 4 par jour
    # avec un seul créneau horaire) : deux créneaux par heure augmentent la fréquence réelle.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # pour la réactivation automatique (étape « Maintien en activité »)

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3
      # Les archives annuelles ne changent plus : on les garde en cache entre deux exécutions
      - uses: actions/cache@v4
        with:
          path: .cache
          key: archives-v1-${{ github.run_id }}
          restore-keys: archives-v1-
      - name: Calcul des données
        run: python pipeline/build.py --out _site/data --cache .cache
      - name: Assemblage du site
        run: |
          cp site/* _site/
          # Force le navigateur à recharger le code à chaque nouvelle version
          sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA::7}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA::7}\"/" _site/index.html
          grep -o 'app.js?v=[a-f0-9]*\|style.css?v=[a-f0-9]*' _site/index.html
          du -sh _site/data/*
          du -sh _site/data/*/*
      - name: Vérification du fond de carte IGN (informative)
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "Plan IGN : HTTP %{http_code}, %{content_type}\n" \
            "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX=6&TILEROW=22&TILECOL=32"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub désactive les workflows planifiés d'un dépôt public après 60 jours sans commit.
      # Réactiver le workflow par l'API remet ce compteur à zéro, sans commit ni push.
      - name: Maintien en activité (évite la désactivation après 60 jours)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" && echo "Workflow réactivé"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Vérifie que chaque fichier de données publié répond bien (code HTTP, type, taille)
      - name: Vérification du site publié (informative)
        continue-on-error: true
        run: |
          sleep 20
          base="${{ steps.deployment.outputs.page_url }}"
          for f in index.html app.js data/meta.json data/gazole/series.json data/gazole/stations.json data/gazole/prix-jour.bin data/gazole/prix-heure.bin; do
            curl -sS -o /dev/null -w "$f : HTTP %{http_code}, %{content_type}, %{size_download} octets\n" -H "Accept-Encoding: gzip" "${base}${f}"
          done
