name: Audit des données

on:
  workflow_dispatch:
  push:
    branches: ["claude/audit-**"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3 shapely==2.0.6
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: archives-v1-audit
          restore-keys: archives-v1-
      - name: Calcul des données
        run: python pipeline/build.py --out _site/data --cache .cache --dump-events "events-{fuel}.npz" --snapshot flux
      - name: Audit de chaque carburant (relit les mêmes flux et refait tout le calcul indépendamment)
        run: |
          for fuel in gazole e10 sp98; do
            python pipeline/audit.py --fuel "$fuel" --data _site/data --cache .cache --events "events-$fuel.npz" --snapshot flux | tee "audit-$fuel.md"
            cat "audit-$fuel.md" >> "$GITHUB_STEP_SUMMARY"
          done
